name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Lint, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Not `npm audit --audit-level=high` directly: that is all-or-nothing, so
      # an advisory nobody can fix yet leaves the only choices as a permanently
      # red build or dropping the threshold — and dropping it silently stops
      # catching the next one. The gate requires every high/critical to be
      # documented in security/audit-exceptions.json with a reason and a date.
      - name: Audit gate (new or lapsed advisories fail)
        run: node scripts/audit-gate.mjs
      - name: Lint
        run: npx eslint .

      # The richtext sanitizer's whole value is that it fails when a renderer
      # upgrade changes the escaping it depends on. A test nothing runs cannot
      # do that, and this one was not wired in. `--experimental-strip-types` is
      # native on the Node this workflow uses, so it needs no tsx install.
      - name: Richtext sanitizer regression (SEC-P2-1)
        run: node --experimental-strip-types scripts/check-richtext-safe.mjs
      - name: Build
        run: npm run build
